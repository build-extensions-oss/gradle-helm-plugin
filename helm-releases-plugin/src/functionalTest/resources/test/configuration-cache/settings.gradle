/**
 * See publishing in gradle-plugin-convention.gradle.kts
 * https://docs.gradle.org/current/userguide/part8_publish_locally.html#step_3_configure_the_local_repository_in_consumer
 *
 * The build scripts here are Groovy rather than Kotlin on purpose: the Kotlin DSL script compiler in
 * Gradle 8.1.1 cannot read the Kotlin 2.2 metadata these plugins are compiled with, so a Kotlin-DSL
 * fixture could only ever run on the current Gradle. See render-simple in helm-plugin, which is Groovy
 * for the same reason.
 */
pluginManagement {
    repositories {
        maven {
            url = file("../../../../build/local-repo").toURI()
        }
        gradlePluginPortal()
    }
}

include(
    "project-which-installs",
    "project-with-chart",
)
