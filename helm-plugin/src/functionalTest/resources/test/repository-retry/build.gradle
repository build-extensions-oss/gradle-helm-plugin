plugins {
    id 'io.github.build-extensions-oss.helm' version '0.0.1'
}

helm {
    // the test supplies its own fake executable, so no client is downloaded
    downloadClient {
        enabled = false
    }
    repositories {
        example {
            url 'http://127.0.0.1:9/repository'
        }
    }
}

// retry three times without pausing, so the test does not wait out the default delay
tasks.named('helmAddExampleRepository') {
    attempts = 3
    retryDelay = java.time.Duration.ZERO
}
